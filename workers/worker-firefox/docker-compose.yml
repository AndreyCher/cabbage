services:
  worker-firefox:
    image: worker-firefox:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKER_FIREFOX_BASE_IMAGE: "${WORKER_FIREFOX_BASE_IMAGE:-worker-firefox-base:152.0.4-beta.28-ubo1}"
    shm_size: "2gb"
    init: true
    stop_grace_period: 60s
    environment:
      ENABLE_NOVNC: "false"
      NOVNC_PORT: "6080"
      VNC_PORT: "5900"
      DISPLAY: ":99"
      WORKER_SYSTEM_CONFIG: "/config/config.json"
      WORKER_PROFILE: "${WORKER_PROFILE:-test-user-001}"
      COMPONENT_REGISTRY: "/etc/cabbage/components.json"
      CAMOUFOX_EXECUTABLE_PATH: "/opt/camoufox-custom/camoufox-bin"
    ports:
      - "0.0.0.0:8090:8090"
    volumes:
      - ../config:/workers-config:ro
      - ./config:/config:ro
      - ./identities:/identities
      - ./artifacts:/artifacts
      - ../../config/components.json:/etc/cabbage/components.json:ro
    command: ["python", "-m", "app.main"]

  worker-firefox-debug:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKER_FIREFOX_BASE_IMAGE: "${WORKER_FIREFOX_BASE_IMAGE:-worker-firefox-base:152.0.4-beta.28-ubo1}"
    profiles: ["debug"]
    shm_size: "2gb"
    init: true
    stop_grace_period: 60s
    environment:
      ENABLE_NOVNC: "true"
      NOVNC_PORT: "6080"
      VNC_PORT: "5900"
      DISPLAY: ":99"
      WORKER_SYSTEM_CONFIG: "/config/config.json"
      WORKER_PROFILE: "${WORKER_DEBUG_PROFILE:-test-user-001-debug}"
      COMPONENT_REGISTRY: "/etc/cabbage/components.json"
      CAMOUFOX_EXECUTABLE_PATH: "/opt/camoufox-custom/camoufox-bin"
    ports:
      - "0.0.0.0:6080:6080"
      - "0.0.0.0:8090:8090"
    volumes:
      - ../config:/workers-config:ro
      - ./config:/config:ro
      - ./identities:/identities
      - ./artifacts:/artifacts
      - ../../config/components.json:/etc/cabbage/components.json:ro
    command: ["python", "-m", "app.main"]

  consent-test-page:
    image: nginx:1.28-alpine
    container_name: worker-consent-test-page
    profiles: ["consent-test"]
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./consent-test-page:/usr/share/nginx/html:ro
