server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://google-android-webrtc-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  # The built frontend's index.html references its own JS bundle as an
  # absolute /android-emulator-webrtc/assets/... path (its own base path),
  # while the build output only contains assets/... at the image root; alias
  # that prefix back to the same root so the browser actually gets the
  # module instead of a silently-200'd index.html (blank white page, no
  # console-visible 404).
  location /android-emulator-webrtc/ {
    alias /usr/share/nginx/html/;
  }
  location / { try_files $uri $uri/ /index.html; }
}
