server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://google-android-webrtc-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # /api/v1/emulator/screen.mjpeg is a long-lived multipart/x-mixed-replace
    # stream; buffering would delay (or fully block) frames from reaching the
    # browser instead of forwarding each one as it arrives.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
