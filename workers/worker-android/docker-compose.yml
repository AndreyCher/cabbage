services:
  worker-android:
    image: worker-android:0.1.3
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKER_ANDROID_BASE_IMAGE: "${WORKER_ANDROID_BASE_IMAGE:-budtmo/docker-android:emulator_14.0_v3.7.0-p0}"
    init: true
    stop_grace_period: 60s
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      APPIUM: "true"
      WEB_VNC: "false"
      EMULATOR_DEVICE: "${EMULATOR_DEVICE:-Samsung Galaxy S10}"
      WORKER_SYSTEM_CONFIG: "/config/config.json"
      WORKER_PROFILE: "${WORKER_PROFILE:-android-test-001}"
    ports:
      - "0.0.0.0:8091:8090"
    volumes:
      - ../config:/workers-config:ro
      - ./config:/config:ro
      - ./identities:/identities
      - ./artifacts:/artifacts
    command: ["python3","-m","app.main"]

  worker-android-debug:
    image: worker-android:0.1.3
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKER_ANDROID_BASE_IMAGE: "${WORKER_ANDROID_BASE_IMAGE:-budtmo/docker-android:emulator_14.0_v3.7.0-p0}"
    profiles: ["debug"]
    init: true
    stop_grace_period: 60s
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      APPIUM: "true"
      WEB_VNC: "true"
      WEB_VNC_PORT: "6080"
      EMULATOR_DEVICE: "${EMULATOR_DEVICE:-Samsung Galaxy S10}"
      WORKER_SYSTEM_CONFIG: "/config/config.json"
      WORKER_PROFILE: "${WORKER_DEBUG_PROFILE:-android-test-001-debug}"
    ports:
      - "0.0.0.0:6081:6080"
      - "0.0.0.0:8091:8090"
    volumes:
      - ../config:/workers-config:ro
      - ./config:/config:ro
      - ./identities:/identities
      - ./artifacts:/artifacts
    command: ["python3","-m","app.main"]
