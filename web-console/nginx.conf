server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/data-provider/ {
    set $data_provider_upstream data-provider:8080;
    rewrite ^/api/data-provider/(.*)$ /$1 break;
    proxy_pass http://$data_provider_upstream;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location /api/worker/ {
    set $worker_upstream worker-firefox:8090;
    rewrite ^/api/worker/(.*)$ /$1 break;
    proxy_pass http://$worker_upstream;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location /api/controller/ {
    set $controller_upstream controller:8080;
    rewrite ^/api/controller/(.*)$ /$1 break;
    proxy_pass http://$controller_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
